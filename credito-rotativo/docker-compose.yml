services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credito-rotativo
    ports:
      - "8000:8000"
    environment:
      # Padrão: sqlite em volume (sobrevive a reinícios).
      # Para banco em memória:
      #   CREDITO_PERSISTENCIA=memoria docker compose up --build
      CREDITO_PERSISTENCIA: ${CREDITO_PERSISTENCIA:-sqlite}
      CREDITO_DB_PATH: ${CREDITO_DB_PATH:-/data/avaliacoes.db}
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
